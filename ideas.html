    <div class="modal-overlay" id="categoryModal" inert>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalCategoryName" tabindex="-1">
            <div class="modal-header">
                <div class="modal-title-bar">
                    Ideas <span class="path-separator">→</span> <span class="category-name-in-title" id="modalCategoryName">Category</span>
                </div>
                <button type="button" class="modal-close-button" id="modalCloseButton" aria-label="Close folder">×</button>
            </div>
            <div class="modal-column-headers">
                <div class="col-icon"> <!-- Icon column header --> </div>
                <div class="col-name">Name</div>
                <!-- Separators removed from HTML here -->
                <div class="col-date">Date</div>
                <div class="col-revised">Revised</div>
            </div>
            <div class="modal-body">
                <ul class="modal-article-list" id="modalArticleList">
                    <!-- Article links will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const categoryItems = Array.from(document.querySelectorAll('.category-item'));
            const folderIcons = Array.from(document.querySelectorAll('.category-item .folder-icon'));
            const modalOverlay = document.getElementById('categoryModal');
            const modalContent = modalOverlay.querySelector('.modal-content');
            const modalCloseButton = document.getElementById('modalCloseButton');
            const modalCategoryName = document.getElementById('modalCategoryName');
            const modalArticleList = document.getElementById('modalArticleList');
            const backgroundRegions = document.querySelectorAll('header, main');
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            let activeFolder = null;

            const articlesByCategory = { /* ... Same article data with updated dates ... */
                personal: [ { title: "Belgrade Bar Story", date: "July 18, 2024", url: "blog/belgrade-bar-story.html", revised: null }, { title: "Greece Hotel Story", date: "February 8, 2025", url: "blog/greece-hotel-story.html", revised: "May 05, 2025" } ],
                ai: [ { title: "The Future of LLMs", date: "May 15, 2025", url: "blog/future-of-llms.html", revised: null }, { title: "Understanding Vector Databases", date: "May 01, 2025", url: "blog/vector-databases.html", revised: null }, { title: "AI Ethics in Development", date: "Apr 20, 2025", url: "blog/ai-ethics.html", revised: "May 10, 2025" } ],
                cat3: [ { title: "Topic 3 Article 1", date: "Jan 01, 2025", url: "#", revised: null } ], cat4: [], 
                cat5: [ { title: "Topic 5 Article 1", date: "Feb 01, 2025", url: "#", revised: null } ], cat6: [ { title: "Topic 6 Article 1", date: "Mar 01, 2025", url: "#", revised: null } ]
            };

            // Prepare both states before showing the folder cards.
            Promise.all(folderIcons.map(icon => {
                if (icon.complete) return Promise.resolve();
                return new Promise(resolve => {
                    icon.addEventListener('load', resolve, { once: true });
                    icon.addEventListener('error', resolve, { once: true });
                });
            })).then(() => {
                categoryItems.forEach((item, index) => {
                    if (reducedMotion.matches) item.classList.add('visible');
                    else setTimeout(() => item.classList.add('visible'), index * 180 + 100);
                });
            });

            function renderArticles(category) {
                modalArticleList.replaceChildren();
                const articles = articlesByCategory[category] || [];
                if (!articles.length) {
                    const li = document.createElement('li');
                    li.textContent = 'No articles in this category yet.';
                    li.classList.add('show-item');
                    modalArticleList.appendChild(li);
                    return;
                }
                articles.forEach(article => {
                    const li = document.createElement('li');
                    li.classList.add('show-item');
                    const iconContainer = document.createElement('div');
                    iconContainer.className = 'article-icon-container';
                    const icon = document.createElement('img');
                    icon.src = 'images/folder-icon.svg';
                    icon.alt = '';
                    icon.className = 'article-icon';
                    iconContainer.appendChild(icon);
                    const info = document.createElement('div');
                    info.className = 'article-info';
                    const link = document.createElement('a');
                    link.href = article.url;
                    link.className = 'article-title';
                    link.textContent = article.title;
                    info.appendChild(link);
                    const date = document.createElement('p');
                    date.className = 'article-date';
                    date.textContent = article.date;
                    const revised = document.createElement('p');
                    revised.className = 'article-revised';
                    revised.textContent = article.revised || 'X';
                    li.append(iconContainer, info, date, revised);
                    modalArticleList.appendChild(li);
                });
            }

            function openFolder(item) {
                if (activeFolder) activeFolder.setAttribute('aria-expanded', 'false');
                activeFolder = item;
                item.setAttribute('aria-expanded', 'true');
                modalCategoryName.textContent = item.getAttribute('aria-label') || item.dataset.categoryName;
                renderArticles(item.dataset.category);
                backgroundRegions.forEach(region => { region.inert = true; });
                modalOverlay.inert = false;
                modalOverlay.classList.add('visible');
                modalCloseButton.focus({ preventScroll: true });
            }

            function closeFolder() {
                if (!activeFolder) return;
                const focusTarget = activeFolder;
                activeFolder.setAttribute('aria-expanded', 'false');
                activeFolder = null;
                modalOverlay.classList.remove('visible');
                modalOverlay.inert = true;
                backgroundRegions.forEach(region => { region.inert = false; });
                focusTarget.focus({ preventScroll: true });
            }

            function syncFolderFromUrl() {
                const category = new URL(window.location.href).searchParams.get('category');
                const item = categoryItems.find(item => item.dataset.category === category);
                if (item) openFolder(item);
                else closeFolder();
            }

            function requestClose() {
                closeFolder();
                if (history.state && history.state.folderNavigation) history.back();
                else {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('category');
                    history.replaceState(history.state, '', url);
                }
            }

            categoryItems.forEach(item => {
                item.addEventListener('click', event => {
                    // Retain normal link behavior for new tabs and modified clicks.
                    if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                    event.preventDefault();
                    history.pushState({ folderNavigation: true }, '', item.href);
                    openFolder(item);
                });
            });
            window.addEventListener('popstate', syncFolderFromUrl);
            modalCloseButton.addEventListener('click', requestClose);
            modalOverlay.addEventListener('click', event => {
                if (event.target === modalOverlay) requestClose();
            });
            modalOverlay.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    requestClose();
                } else if (event.key === 'Tab') {
                    const focusable = Array.from(modalContent.querySelectorAll('button, a[href]'));
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    if (event.shiftKey && document.activeElement === first) {
                        event.preventDefault();
                        last.focus();
                    } else if (!event.shiftKey && document.activeElement === last) {
                        event.preventDefault();
                        first.focus();
                    }
                }
            });
            syncFolderFromUrl();
        });
    </script>
