<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noahcamaj.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-background"> 
    
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="nav-button">Home</a> 
            </div>
            <div class="nav-right">
                <a href="metrics.html" class="nav-button">Metrics</a> 
                <a href="ideas.html" class="nav-button">Ideas</a> 
                <a href="travel.html" class="nav-button">Travel</a> 
            </div>
        </nav>
    </header>

    <main class="ideas-main-content">
        <h1>Blog Categories</h1>
        <div class="category-grid">
            <!-- Added data-category-name for cleaner title fetching -->
            <div class="category-item" data-category="personal" data-category-name="Personal Stories">
                <img src="images/folder-icon.svg" alt="Folder Icon" class="folder-icon">
                <p>Personal Stories</p>
            </div>
            <div class="category-item" data-category="ai" data-category-name="Artificial Intelligence">
                <img src="images/folder-icon.svg" alt="Folder Icon" class="folder-icon">
                <p>Artificial Intelligence</p>
            </div>
            <div class="category-item category-undefined" data-category="cat3" data-category-name="Category 3">
                <img src="images/folder-icon.svg" alt="Folder Icon" class="folder-icon">
                <p>Category 3</p>
            </div>
            <div class="category-item category-undefined" data-category="cat4" data-category-name="Category 4">
                <img src="images/folder-icon.svg" alt="Folder Icon" class="folder-icon">
                <p>Category 4</p>
            </div>
            <div class="category-item category-undefined" data-category="cat5" data-category-name="Category 5">
                <img src="images/folder-icon.svg" alt="Folder Icon" class="folder-icon">
                <p>Category 5</p>
            </div>
            <div class="category-item category-undefined" data-category="cat6" data-category-name="Category 6">
                <img src="images/folder-icon.svg" alt="Folder Icon" class="folder-icon">
                <p>Category 6</p>
            </div>
        </div>
    </main>

    <!-- Modal Structure (Initially Hidden by CSS) -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCategoryTitle">Category Articles</h2>
                <button class="modal-close-button" id="modalCloseButton">×</button> <!-- Using × for a nicer X -->
            </div>
            <div class="modal-body">
                <ul class="modal-article-list" id="modalArticleList">
                    <!-- Article links will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const categoryItems = document.querySelectorAll('.category-item');
            const modalOverlay = document.getElementById('categoryModal');
            const modalContent = modalOverlay.querySelector('.modal-content');
            const modalCloseButton = document.getElementById('modalCloseButton');
            const modalCategoryTitle = document.getElementById('modalCategoryTitle');
            const modalArticleList = document.getElementById('modalArticleList');

            // --- Dummy Article Data (Replace with your actual data source later) ---
            // Links should point to actual .html files, e.g., 'blog/my-first-story.html'
            // Create a 'blog' subfolder for your posts.
            const articlesByCategory = {
                personal: [
                    { title: "My Journey into Coding", date: "May 20, 2025", url: "blog/personal-journey.html" },
                    { title: "Lessons Learned from Traveling Solo", date: "Apr 10, 2025", url: "blog/travel-lessons.html" }
                ],
                ai: [
                    { title: "The Future of LLMs", date: "May 15, 2025", url: "blog/future-of-llms.html" },
                    { title: "Understanding Vector Databases", date: "May 01, 2025", url: "blog/vector-databases.html" },
                    { title: "AI Ethics in Development", date: "Apr 20, 2025", url: "blog/ai-ethics.html" }
                ],
                cat3: [ { title: "Topic 3 Article 1", date: "Jan 01, 2025", url: "#" } ],
                cat4: [], // Example of an empty category
                cat5: [ { title: "Topic 5 Article 1", date: "Feb 01, 2025", url: "#" } ],
                cat6: [ { title: "Topic 6 Article 1", date: "Mar 01, 2025", url: "#" } ]
            };
            // --- End Dummy Article Data ---

            categoryItems.forEach(item => {
                // Changed from 'a' tag to 'div' so click doesn't try to navigate
                item.addEventListener('click', () => { 
                    const category = item.dataset.category;
                    const categoryName = item.dataset.categoryName || "Category"; 
                    const articles = articlesByCategory[category] || [];

                    modalCategoryTitle.textContent = categoryName;
                    modalArticleList.innerHTML = ''; 

                    if (articles.length === 0) {
                        const li = document.createElement('li');
                        li.textContent = 'No articles in this category yet.';
                        modalArticleList.appendChild(li);
                        setTimeout(() => li.classList.add('show-item'), 50); // Animate this single item
                    } else {
                        articles.forEach((article, index) => {
                            const li = document.createElement('li');
                            li.innerHTML = `
                                <a href="${article.url}" class="article-title">${article.title}</a>
                                <p class="article-date">${article.date}</p>
                            `;
                            modalArticleList.appendChild(li);
                            // Sequential animation for list items
                            setTimeout(() => {
                                li.classList.add('show-item');
                            }, index * 100 + 50); // Stagger animation
                        });
                    }

                    // Animation: Expand from icon
                    const iconRect = item.querySelector('.folder-icon').getBoundingClientRect();
                    
                    // Calculate the center of the icon relative to the viewport
                    const iconCenterX = iconRect.left + iconRect.width / 2;
                    const iconCenterY = iconRect.top + iconRect.height / 2;

                    // Convert this to be relative to the modalOverlay for transform-origin
                    // This assumes modalOverlay is fullscreen.
                    modalContent.style.transformOrigin = `${iconCenterX}px ${iconCenterY}px`;
                    modalContent.style.transform = 'scale(0.05)'; // Start very small, from where icon was
                    modalContent.style.opacity = '0';
                    
                    modalOverlay.style.opacity = '0'; // Start overlay transparent for its own fade-in
                    modalOverlay.classList.add('visible');
                    
                    requestAnimationFrame(() => { // Ensure overlay starts its transition
                        modalOverlay.style.opacity = '1'; 
                        requestAnimationFrame(() => { // Then start modal content animation
                             modalContent.style.transform = 'scale(1)';
                             modalContent.style.opacity = '1';
                        });
                    });
                });
            });

            function closeModal() {
                // Simple shrink and fade out for now. 
                // Reverse animation to icon is more complex if page has scrolled.
                const modalRect = modalContent.getBoundingClientRect();
                modalContent.style.transformOrigin = `${modalRect.width / 2}px ${modalRect.height / 2}px`; // Re-center origin for symmetrical shrink
                
                modalContent.style.transform = 'scale(0.5)'; 
                modalContent.style.opacity = '0';
                
                modalOverlay.style.opacity = '0';
                setTimeout(() => {
                    modalOverlay.classList.remove('visible');
                    // Reset transform and opacity for next open
                    modalContent.style.transform = 'scale(0.5)'; 
                    modalContent.style.opacity = '0';
                }, 300); // Match CSS transition duration for opacity
            }

            modalCloseButton.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (event) => {
                if (event.target === modalOverlay) {
                    closeModal();
                }
            });
            // Optional: Close modal with Escape key
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && modalOverlay.classList.contains('visible')) {
                    closeModal();
                }
            });
        });
    </script>

</body>
</html>
