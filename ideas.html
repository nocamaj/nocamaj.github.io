    <div class="modal-overlay" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-bar">
                    Ideas <span class="path-separator">→</span> <span class="category-name-in-title" id="modalCategoryName">Category</span>
                </div>
                <button class="modal-close-button" id="modalCloseButton">×</button>
            </div>
            <div class="modal-column-headers">
                <div class="col-icon"> <!-- Icon column header --> </div>
                <div class="col-name">Name</div>
                <span class="col-separator">|</span>
                <div class="col-date">Date</div>
                <span class="col-separator">|</span>
                <div class="col-revised">Revised</div>
            </div>
            <div class="modal-body">
                <ul class="modal-article-list" id="modalArticleList">
                    <!-- Article links will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const categoryGrid = document.querySelector('.category-grid'); // Get the grid container
            const categoryItems = Array.from(categoryGrid.querySelectorAll('.category-item')); // Convert NodeList to Array
            const modalOverlay = document.getElementById('categoryModal');
            const modalContent = modalOverlay.querySelector('.modal-content');
            const modalCloseButton = document.getElementById('modalCloseButton');
            const modalBreadcrumbCategoryName = document.getElementById('modalCategoryName');
            const modalArticleList = document.getElementById('modalArticleList');

            const articlesByCategory = { /* ... Same article data ... */
                personal: [ { title: "My Journey into Coding", date: "May 20, 2025", url: "blog/personal-journey.html", revised: null }, { title: "Lessons Learned from Traveling Solo", date: "Apr 10, 2025", url: "blog/travel-lessons.html", revised: "May 05, 2025" } ],
                ai: [ { title: "The Future of LLMs", date: "May 15, 2025", url: "blog/future-of-llms.html", revised: null }, { title: "Understanding Vector Databases", date: "May 01, 2025", url: "blog/vector-databases.html", revised: null }, { title: "AI Ethics in Development", date: "Apr 20, 2025", url: "blog/ai-ethics.html", revised: "May 10, 2025" } ],
                cat3: [ { title: "Topic 3 Article 1", date: "Jan 01, 2025", url: "#", revised: null } ], cat4: [], 
                cat5: [ { title: "Topic 5 Article 1", date: "Feb 01, 2025", url: "#", revised: null } ], cat6: [ { title: "Topic 6 Article 1", date: "Mar 01, 2025", url: "#", revised: null } ]
            };

            // Sequential load animation for category items on page load
            categoryItems.forEach((item, index) => {
                setTimeout(() => {
                    item.classList.add('visible');
                }, index * 150 + 100); // Stagger the appearance of each folder
            });


            categoryItems.forEach(item => {
                item.addEventListener('click', () => { 
                    const category = item.dataset.category;
                    const categoryName = item.querySelector('p').textContent || "Category"; 
                    const articles = articlesByCategory[category] || [];

                    modalBreadcrumbCategoryName.textContent = categoryName;
                    modalArticleList.innerHTML = ''; 

                    if (articles.length === 0) { /* ... no articles message ... */
                        const li = document.createElement('li');
                        li.style.textAlign = 'center'; li.style.padding = '20px 0';
                        li.textContent = 'No articles in this category yet.';
                        modalArticleList.appendChild(li);
                        setTimeout(() => li.classList.add('show-item'), 50);
                    } else {
                        articles.forEach((article, index) => {
                            const li = document.createElement('li');
                            const revisedDate = article.revised ? article.revised : 'X'; 
                            li.innerHTML = `
                                <img src="images/folder-icon.svg" alt="Article" class="article-icon">
                                <div class="article-info">
                                    <a href="${article.url}" class="article-title">${article.title}</a>
                                </div>
                                <p class="article-date">${article.date}</p>
                                <p class="article-revised">${revisedDate}</p> 
                            `; 
                            modalArticleList.appendChild(li);
                            setTimeout(() => {
                                li.classList.add('show-item');
                            }, index * 250 + 150); // Keep this for articles in modal
                        });
                    }
                    // ... (rest of modal open animation logic) ...
                    const iconRect = item.querySelector('.folder-icon').getBoundingClientRect();
                    const iconCenterX = iconRect.left + iconRect.width / 2;
                    const iconCenterY = iconRect.top + iconRect.height / 2;
                    modalContent.style.transformOrigin = `${iconCenterX}px ${iconCenterY}px`;
                    modalContent.style.transform = 'scale(0.05)'; 
                    modalContent.style.opacity = '0';
                    modalOverlay.style.opacity = '0'; 
                    modalOverlay.classList.add('visible');
                    requestAnimationFrame(() => { 
                        modalOverlay.style.opacity = '1'; 
                        requestAnimationFrame(() => { 
                             modalContent.style.transform = 'scale(1)';
                             modalContent.style.opacity = '1';
                        });
                    });
                });
            });

            function closeModal() { /* ... closeModal unchanged ... */
                const modalRect = modalContent.getBoundingClientRect();
                modalContent.style.transformOrigin = `${modalRect.width / 2}px ${modalRect.height / 2}px`;
                modalContent.style.transform = 'scale(0.5)'; modalContent.style.opacity = '0';
                modalOverlay.style.opacity = '0';
                setTimeout(() => {
                    modalOverlay.classList.remove('visible');
                    modalContent.style.transform = 'scale(0.5)'; modalContent.style.opacity = '0';
                }, 300); 
            }

            modalCloseButton.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (event) => { if (event.target === modalOverlay) { closeModal(); } });
            document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && modalOverlay.classList.contains('visible')) { closeModal(); } });
        });
    </script>
