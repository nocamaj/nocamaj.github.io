<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noahcamaj.com</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
    <!-- script.js (for ASCII animation) is NO LONGER included here -->
</head>
<body class="travel-page-background"> 

    <!-- Background Animation Div has been REMOVED -->
    
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="nav-button">Home</a> 
            </div>
            <div class="nav-right">
                <a href="#" class="nav-button">Metrics</a> 
                <a href="#" class="nav-button">Ideas</a>   
                <a href="travel.html" class="nav-button">Travel</a> 
            </div>
        </nav>
    </header>

    <main class="travel-main">
        <div class="map-outer-container">
            <div class="map-legend">
                <div class="legend-item">
                    <span class="legend-color-box" style="background-color: #FFC04D;"></span> - Visited
                </div>
                <div class="legend-item">
                    <span class="legend-color-box" style="background-color: #8FBC8F;"></span> - Lived
                </div>
            </div>
            <div id="map"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // Map JavaScript (Leaflet) - This logic remains specific to the travel page
        const visitedCountriesISO_A2 = [
            "AT", "BZ", "BA", "CA", "CN", "HR", "GR", "HU", "IT", "MK", 
            "MX", "ME", "NL", "PE", "PL", "LC", "VC", "RS", "SK", "ES", "CH", 
            "TR", "AE", "GB"
        ]; 
        const visitedCountriesByName = ["FRANCE", "KOSOVO"];
        const livedCountriesISO_A2 = ["US", "AL"]; 
        const livedCountriesByName = [];

        const map = L.map('map', {
            center: [20, 0], 
            zoom: 2,
            minZoom: 2,     
            maxZoom: 8,     
            worldCopyJump: true,
            attributionControl: false,
        });

        const defaultStyle = { fillColor: "#585858", weight: 0.5, opacity: 1, color: '#101010', fillOpacity: 0.7 };
        const visitedStyle = { fillColor: "#FFC04D", weight: 0.7, opacity: 1, color: '#000000', fillOpacity: 0.9 };
        const livedStyle = { fillColor: "#8FBC8F", weight: 0.7, opacity: 1, color: '#000000', fillOpacity: 0.95 };

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson') 
            .then(response => {
                if (!response.ok) { throw new Error('GeoJSON Network response error'); }
                return response.json();
            })
            .then(data => {
                L.geoJson(data, {
                    style: function(feature) {
                        const countryISO = feature.properties["ISO3166-1-Alpha-2"];
                        const countryName = (feature.properties.name || feature.properties.ADMIN || "").toUpperCase(); 
                        
                        if (countryISO && countryISO !== "-99" && livedCountriesISO_A2.includes(countryISO.toUpperCase())) { return livedStyle; } 
                        else if (livedCountriesByName.includes(countryName)) { return livedStyle; }
                        else if (countryISO && countryISO !== "-99" && visitedCountriesISO_A2.includes(countryISO.toUpperCase())) { return visitedStyle; } 
                        else if (visitedCountriesByName.includes(countryName)) { return visitedStyle; }
                        return defaultStyle;
                    },
                    onEachFeature: function(feature, layer) {
                        let cName = feature.properties.name || feature.properties.ADMIN; 
                        if (cName) { layer.bindPopup(cName); }
                    }
                }).addTo(map);
                setTimeout(() => { map.invalidateSize(); }, 100); 
            })
            .catch(error => {
                console.error('Error loading or parsing GeoJSON for map:', error);
                const mapDiv = document.getElementById('map');
                if (mapDiv) { mapDiv.innerHTML = `<p style="text-align:center; padding-top: 50px; color: white;">Could not load map data. Error: ${error.message}</p>`; }
            });
    </script>

</body>
</html>
