<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah's Site - Travel</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>
<body class="travel-page-background"> 
    
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="nav-button">Home</a> 
            </div>
            <div class="nav-right">
                <a href="#" class="nav-button">Metrics</a> 
                <a href="#" class="nav-button">Ideas</a>   
                <a href="Travel.html" class="nav-button">Travel</a> 
            </div>
        </nav>
    </header>

    <main class="travel-main"> {/* This main tag might become less important for direct map sizing */}
        <div class="map-outer-container">
            <div id="map"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // IMPORTANT: Double-check these ISO A2 codes. They MUST be uppercase and correct.
        // Test with a very small, known-good list first if highlighting fails.
        // e.g., const visitedCountriesISO_A2 = ["US", "CA", "FR"];
        const visitedCountriesISO_A2 = [
            "US", "CA", "MX", "FR", "DE", "IT", "ES", "GB", "JP", "AU", 
            "CN", "RU", "IN", "BR", "PT", "AR", "CL", "ZA", "EG", "KE", 
            "NG", "GH", "MA", "SE", "NO", "FI", "PL", "UA", "TR", "IR", 
            "SA", "ID", "TH", "VN", "PH", "MY", "KR", "NZ" 
            // Add or remove countries as needed using their 2-letter ISO A2 codes
        ]; 

        const map = L.map('map', {
            center: [20, 0], 
            zoom: 2, // Start zoomed out to see the whole map
            minZoom: 2,     
            maxZoom: 8,     
            worldCopyJump: true,
            attributionControl: false,
        });

        const defaultStyle = {
            fillColor: "#585858", // Made 25% lighter (was #383838)
            weight: 0.5,          
            opacity: 1,
            color: '#101010',    
            fillOpacity: 0.7
        };

        const visitedStyle = {
            fillColor: "#FFFFFF", 
            weight: 0.7,          
            opacity: 1,
            color: '#000000',    
            fillOpacity: 0.9     
        };

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson') 
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok for GeoJSON: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                L.geoJson(data, {
                    style: function(feature) {
                        const countryISO = feature.properties.ISO_A2; // This is correct for this GeoJSON
                        if (visitedCountriesISO_A2.includes(countryISO)) {
                            // console.log("Visited:", countryISO, feature.properties.ADMIN); // For debugging
                            return visitedStyle;
                        }
                        return defaultStyle;
                    },
                    onEachFeature: function(feature, layer) {
                        let countryName = feature.properties.ADMIN; 
                        if (countryName) {
                            layer.bindPopup(countryName);
                        }
                    }
                }).addTo(map);
            })
            .catch(error => {
                console.error('Error loading or parsing GeoJSON:', error);
                const mapDiv = document.getElementById('map');
                if (mapDiv) {
                    mapDiv.innerHTML = `<p style="text-align:center; padding-top: 50px; color: white;">Could not load map data. Error: ${error.message}</p>`;
                }
            });
    </script>

</body>
</html>
