<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noahcamaj.com</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>
<body class="travel-page-background"> 
    
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="nav-button">Home</a> 
            </div>
            <div class="nav-right">
                <a href="#" class="nav-button">Metrics</a> 
                <a href="#" class="nav-button">Ideas</a>   
                <a href="Travel.html" class="nav-button">Travel</a> 
            </div>
        </nav>
    </header>

    <main class="travel-main">
        <div class="map-outer-container">
            <div id="map"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <script>
        // TEST WITH A VERY SMALL LIST FIRST!
        const visitedCountriesISO_A2 = ["US", "CA", "FR", "DE", "JP", "ID", "MY", "CL", "BO", "PE"]; // Added codes from your screenshot for testing

        const map = L.map('map', {
            center: [20, 0], 
            zoom: 2,
            minZoom: 2,     
            maxZoom: 8,     
            worldCopyJump: true,
            attributionControl: false,
        });

        const defaultStyle = {
            fillColor: "#585858", 
            weight: 0.5,          
            opacity: 1,
            color: '#101010',    
            fillOpacity: 0.7
        };

        const visitedStyle = {
            fillColor: "#FFC04D", // Light orange for visited countries
            weight: 0.7,          
            opacity: 1,
            color: '#000000',    
            fillOpacity: 0.9     
        };

        let featureCounter = 0; 

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson') 
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok for GeoJSON: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                L.geoJson(data, {
                    style: function(feature) {
                        if (featureCounter < 10) { // Log a few more to be sure
                            console.log("Feature properties:", feature.properties);
                            featureCounter++;
                        }

                        // CORRECTED PROPERTY NAME HERE:
                        const countryISO = feature.properties["ISO3166-1-Alpha-2"]; 
                        
                        if (countryISO && visitedCountriesISO_A2.includes(countryISO.toUpperCase())) { 
                            console.log("Highlighting Visited:", countryISO, feature.properties.name); // Changed from ADMIN to name based on your screenshot
                            return visitedStyle;
                        }
                        return defaultStyle;
                    },
                    onEachFeature: function(feature, layer) {
                        // Use 'name' for the popup, as seen in your screenshot
                        let countryName = feature.properties.name; 
                        if (countryName) {
                            layer.bindPopup(countryName);
                        }
                    }
                }).addTo(map);

                setTimeout(() => {
                    map.invalidateSize();
                }, 100); 

            })
            .catch(error => {
                console.error('Error loading or parsing GeoJSON:', error);
                const mapDiv = document.getElementById('map');
                if (mapDiv) {
                    mapDiv.innerHTML = `<p style="text-align:center; padding-top: 50px; color: white;">Could not load map data. Error: ${error.message}</p>`;
                }
            });
    </script>

</body>
</html>
