<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah's Site - Travel</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
</head>
<body class="travel-page-background"> 
    
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="nav-button">Home</a> 
            </div>
            <div class="nav-right">
                <a href="#" class="nav-button">Metrics</a> 
                <a href="#" class="nav-button">Ideas</a>   
                <a href="Travel.html" class="nav-button">Travel</a> 
            </div>
        </nav>
    </header>

    <main class="travel-main">
        <div class="map-outer-container">
            <div id="map"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // IMPORTANT: ENSURE THESE ARE CORRECT UPPERCASE ISO A2 CODES.
        const visitedCountriesISO_A2 = [
            "US", "CA", "MX", "FR", "DE", "IT", "ES", "GB", "JP", "AU", "SE" 
            // Add a few known good ones like "SE" for Sweden to test.
        ]; 

        const map = L.map('map', {
            center: [20, 0], 
            zoom: 2,
            minZoom: 2,     
            maxZoom: 8,     
            worldCopyJump: true,
            attributionControl: false,
        });

        const defaultStyle = {
            fillColor: "#585858", // Kept as per last update
            weight: 0.5,          
            opacity: 1,
            color: '#101010',    
            fillOpacity: 0.7
        };

        const visitedStyle = {
            fillColor: "#FFB732", // Light Orange
            weight: 0.7,          
            opacity: 1,
            color: '#000000',    
            fillOpacity: 0.9     
        };
        
        let geoJsonLayer; // To potentially re-style later if needed

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson') 
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok for GeoJSON: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                // For debugging the first few features from GeoJSON:
                // console.log("First 3 GeoJSON features properties:", data.features.slice(0,3).map(f => f.properties));

                geoJsonLayer = L.geoJson(data, {
                    style: function(feature) {
                        // Try multiple common property names for ISO A2 code, prioritizing ISO_A2
                        const countryISO = feature.properties.ISO_A2 || feature.properties.iso_a2 || feature.properties.ISO_A2_EH;
                        
                        if (visitedCountriesISO_A2.includes(String(countryISO).toUpperCase())) { // Ensure comparison is robust
                            // console.log("MATCHED Visited:", countryISO, feature.properties.ADMIN); 
                            return visitedStyle;
                        }
                        return defaultStyle;
                    },
                    onEachFeature: function(feature, layer) {
                        // Try multiple common property names for country name
                        let countryName = feature.properties.ADMIN || feature.properties.NAME || feature.properties.name || feature.properties. sovereignt; 
                        if (countryName) {
                            layer.bindPopup(countryName);
                        }
                    }
                }).addTo(map);

                // Optional: Fit map to the bounds of the GeoJSON layer after it's added
                // This can help ensure the whole world is visible initially if zoom/center is off
                // map.fitBounds(geoJsonLayer.getBounds(), {padding: [10,10]}); // Add slight padding
            })
            .catch(error => {
                console.error('Error loading or parsing GeoJSON:', error);
                const mapDiv = document.getElementById('map');
                if (mapDiv) {
                    mapDiv.innerHTML = `<p style="text-align:center; padding-top: 50px; color: white;">Could not load map data. Error: ${error.message}</p>`;
                }
            });
    </script>

</body>
</html>
