<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah's Site - Travel</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- style.css will now handle the map container styles -->
</head>
<body class="travel-page-background"> 
    
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="nav-button">Home</a> 
            </div>
            <div class="nav-right">
                <a href="#" class="nav-button">Metrics</a> 
                <a href="#" class="nav-button">Ideas</a>   
                <a href="Travel.html" class="nav-button">Travel</a> 
            </div>
        </nav>
    </header>

    <main class="travel-main">
        <div class="map-outer-container"> {/* New wrapper for border and padding */}
            <div id="map"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

    <script>
        // List of visited countries (USE ISO A2 CODES: e.g., "US", "CA", "FR")
        const visitedCountriesISO_A2 = [
            "US", "CA", "MX", "FR", "DE", "IT", "ES", "GB", "JP", "AU", 
            "CN", "RU", "IN", "BR", "PT", "AR", "CL", "ZA", "EG", "KE", 
            "NG", "GH", "MA", "SE", "NO", "FI", "PL", "UA", "TR", "IR", 
            "SA", "ID", "TH", "VN", "PH", "MY", "KR", "NZ" 
            // Add or remove countries as needed using their 2-letter ISO A2 codes
        ]; 

        const map = L.map('map', {
            center: [20, 0], 
            zoom: 2,        
            minZoom: 2,     
            maxZoom: 8,     
            worldCopyJump: true,
            attributionControl: false,
            // Optional: to make the map feel more like your reference image, you could set a maxBounds
            // maxBounds: [[-90, -180], [90, 180]], // Prevents panning beyond world edges
            // maxBoundsViscosity: 1.0 // Makes the bounds hard
        });

        const defaultStyle = {
            fillColor: "#383838", // Slightly lighter dark grey for unvisited countries
            weight: 0.5,          // Thinner border
            opacity: 1,
            color: '#101010',    // Darker border color
            fillOpacity: 0.7
        };

        const visitedStyle = {
            fillColor: "#FFFFFF", // White for visited countries
            weight: 0.7,          // Slightly more prominent border for visited
            opacity: 1,
            color: '#000000',    // Black border for visited for contrast
            fillOpacity: 0.9     // More opaque
        };

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson') 
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok for GeoJSON: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                L.geoJson(data, {
                    style: function(feature) {
                        const countryISO = feature.properties.ISO_A2; 
                        if (visitedCountriesISO_A2.includes(countryISO)) {
                            return visitedStyle;
                        }
                        return defaultStyle;
                    },
                    onEachFeature: function(feature, layer) {
                        let countryName = feature.properties.ADMIN; 
                        if (countryName) {
                            layer.bindPopup(countryName);
                        }
                    }
                }).addTo(map);
            })
            .catch(error => {
                console.error('Error loading or parsing GeoJSON:', error);
                const mapDiv = document.getElementById('map');
                if (mapDiv) {
                    mapDiv.innerHTML = `<p style="text-align:center; padding-top: 50px; color: white;">Could not load map data. Error: ${error.message}</p>`;
                }
            });

        // L.control.scale({imperial: false}).addTo(map); // Optional scale
    </script>

</body>
</html>
